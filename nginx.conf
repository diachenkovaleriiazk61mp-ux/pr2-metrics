worker_processes auto;
events { worker_connections 16384; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    log_format pods '$time_iso8601 "$request" $status upstream=$upstream_addr pod=$upstream_http_x_pod';
    access_log /dev/stdout pods;
    upstream api {
        zone api 64k;
        server web:8000 resolve max_fails=1 fail_timeout=2s;
        keepalive 64;
    }
    server {
        listen 8080 backlog=4096;
        location = /noop { access_log off; return 204; }
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 4;
        }
    }
}
